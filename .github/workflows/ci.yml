name: CI

# Trigger the workflow on push or pull request
on: [ push, pull_request ]

jobs:
  test-latest:
    strategy:
      matrix:
        os: [ ubuntu-22.04, ubuntu-24.04, ubuntu-24.04-arm, ubuntu-26.04, ubuntu-26.04-arm,
              macos-15, macos-15-intel, macos-26, macos-26-intel ]
      fail-fast: false
    name: "Test latest ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Download BSC
        id: download
        uses: ./
        with:
          os: ${{ matrix.os }}
          version: latest
          path: ../

      - name: Build
        run: |
          echo Version tag: ${{steps.download.outputs.tag}}
          echo Version hash: ${{steps.download.outputs.commit}}
          export PATH=$PWD/../bsc/bin:$PATH
          bsc -v

  test-release:
    strategy:
      matrix:
        version: [ 2026.01, 2026.07.1 ]
        os: [ ubuntu-22.04, ubuntu-24.04, ubuntu-24.04-arm, ubuntu-26.04, ubuntu-26.04-arm,
              macos-15, macos-15-intel, macos-26, macos-26-intel ]
        exclude:
          # Ubuntu ARM was introduced at 2026.07.1
          - version: 2026.01
            os: ubuntu-24.04-arm
          - version: 2026.01
            os: ubuntu-26.04-arm
          # macOS 26 Intel was introduced at 2026.07.1
          - version: 2026.01
            os: macos-26-intel
      fail-fast: false
    name: "Test release ${{ matrix.version }} ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Download BSC
        id: download
        uses: ./
        with:
          os: ${{ matrix.os }}
          version: ${{ matrix.version }}
          path: ../

      - name: Build
        run: |
          echo Version tag: ${{steps.download.outputs.tag}}
          echo Version hahs: ${{steps.download.outputs.commit}}
          export PATH=$PWD/../bsc/bin:$PATH
          bsc -v
